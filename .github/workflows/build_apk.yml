name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace || echo "Release signing requires keystore secrets; skipping unsigned release bundle."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-arena-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK if built
        uses: actions/upload-artifact@v4
        with:
          name: pulse-arena-release-apk
          path: app/build/outputs/apk/release/
          if-no-files-found: ignore
